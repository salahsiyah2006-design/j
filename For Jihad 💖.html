<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Jihad 💖</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💖</text></svg>">
<style>
  :root {
    --bg1: #ffd6e7; --bg2: #ffeef8; --card: rgba(255,255,255,.85);
    --text: #7a1f4d; --accent: #ff4d94; --accent2: #ff85b8; --soft: #ffe3ef;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg1: #3a1230; --bg2: #25101f; --card: rgba(60,25,50,.85); --text: #ffd6ea; --soft: #5a2147; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Baloo 2", "Comic Sans MS", "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; text-align: center;
  }
  .card {
    position: relative; z-index: 2; width: min(92vw, 440px);
    background: var(--card); backdrop-filter: blur(6px);
    border-radius: 32px; padding: 34px 24px 30px;
    box-shadow: 0 18px 50px rgba(255,77,148,.25);
    animation: pop .8s cubic-bezier(.2,1.4,.4,1) both;
  }
  .bear { font-size: 84px; line-height: 1; display: inline-block; animation: bounce 1.6s ease-in-out infinite; }
  h1 { font-size: clamp(26px, 7vw, 36px); margin: 14px 0 6px; line-height: 1.2; }
  h1 span { color: var(--accent); }
  .sub { margin: 0 0 24px; opacity: .8; font-size: 17px; }
  .buttons { display: flex; gap: 18px; justify-content: center; align-items: center; min-height: 64px; }
  button {
    font: inherit; font-size: 20px; font-weight: 700; border: 0; cursor: pointer;
    padding: 14px 30px; border-radius: 999px; color: #fff; user-select: none;
    transition: transform .2s, left .35s cubic-bezier(.3,1.5,.5,1), top .35s cubic-bezier(.3,1.5,.5,1);
  }
  #yes { background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 8px 20px rgba(255,77,148,.45); animation: pulse 1.4s ease-in-out infinite; }
  #yes:hover { transform: scale(1.1); }
  #yes { font-size: calc(var(--btn-fs, 20px) * var(--grow, 1)); }
  button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .buttons { flex-wrap: wrap; }
  @media (max-width: 480px) {
    :root { --btn-fs: 18px; }
    .card { padding: 26px 16px 24px; border-radius: 26px; }
    .bear { font-size: 68px; }
    .sub { font-size: 15px; margin-bottom: 18px; }
    .buttons { gap: 12px; }
    button { padding: 14px 24px; min-height: 48px; }
  }
  @media (max-height: 520px) {
    .bear { font-size: 48px; }
    h1 { margin: 8px 0 4px; }
    .sub { margin-bottom: 12px; }
  }
  #no { background: #9a8aa5; box-shadow: 0 6px 14px rgba(0,0,0,.18); }
  #no.fly { position: fixed; z-index: 10; margin: 0; }
  .hint { min-height: 28px; margin-top: 18px; font-size: 16px; opacity: .85; }
  #result { display: none; }
  .show-result #question { display: none; }
  .show-result #result { display: block; animation: pop .8s cubic-bezier(.2,1.4,.4,1) both; }
  #result h1 { font-size: clamp(34px, 10vw, 52px); color: var(--accent); }
  .sign { margin-top: 18px; font-size: 20px; font-weight: 700; }
  .heart { position: fixed; bottom: -40px; z-index: 1; pointer-events: none; animation: float linear forwards; }
  .burst { position: fixed; z-index: 20; pointer-events: none; font-size: 26px; animation: burst 1.6s ease-out forwards; }
  @keyframes float { to { transform: translateY(-115vh) rotate(40deg); opacity: 0; } }
  @keyframes burst { to { transform: translate(var(--dx), var(--dy)) scale(1.4) rotate(var(--r)); opacity: 0; } }
  @keyframes bounce { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-14px) rotate(4deg); } }
  @keyframes pulse { 0%,100% { box-shadow: 0 8px 20px rgba(255,77,148,.45); } 50% { box-shadow: 0 8px 34px rgba(255,77,148,.8); } }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>
  <main class="card" id="card">
    <div id="question">
      <div class="bear">🧸</div>
      <h1>Jihad, do you love me? <span>🥺</span></h1>
      <p class="sub">Please answer honestly…</p>
      <div class="buttons" id="buttons">
        <button id="yes">Oui 💖</button>
        <button id="no">Non 💔</button>
      </div>
      <div class="hint" id="hint"></div>
    </div>
    <div id="result">
      <div class="bear">🥰</div>
      <h1>Me too 💖</h1>
      <p class="sub">I love you so much, Jihad ✨</p>
      <div class="sign">— Salah 🌹</div>
    </div>
  </main>

<script>
(function () {
  var yes = document.getElementById('yes');
  var no = document.getElementById('no');
  var hint = document.getElementById('hint');
  var box = document.getElementById('buttons');
  var dodges = 0, placeholder = null;
  var msgs = ['Oops, wrong button 😜', 'Are you sure? 🥺', 'Try again 💕', 'Wrong button, my love 😘', 'Nope, nice try! 🙈', 'Just press Oui 💖'];

  function hearts() {
    var h = document.createElement('div');
    h.className = 'heart';
    h.textContent = ['💖', '💕', '💗', '🌸', '✨'][Math.floor(Math.random() * 5)];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = (16 + Math.random() * 26) + 'px';
    h.style.animationDuration = (6 + Math.random() * 6) + 's';
    document.body.appendChild(h);
    setTimeout(function () { h.remove(); }, 12500);
  }
  setInterval(hearts, 450);
  for (var i = 0; i < 8; i++) setTimeout(hearts, i * 120);

  function dodge(e) {
    if (e && e.preventDefault) e.preventDefault();
    if (!no.classList.contains('fly')) {
      var r = no.getBoundingClientRect();
      placeholder = document.createElement('div');
      placeholder.style.width = r.width + 'px';
      placeholder.style.height = r.height + 'px';
      box.appendChild(placeholder);
      no.classList.add('fly');
      no.style.left = r.left + 'px';
      no.style.top = r.top + 'px';
      void no.offsetWidth;
    }
    var w = no.offsetWidth, h = no.offsetHeight, pad = 14;
    var maxX = Math.max(pad, window.innerWidth - w - pad);
    var maxY = Math.max(pad, window.innerHeight - h - pad);
    var cx = parseFloat(no.style.left) || pad, cy = parseFloat(no.style.top) || pad;
    var yr = yes.getBoundingClientRect();
    var step = window.innerWidth < 480 ? 70 : 110;
    var x = cx, y = cy, tries = 0;
    do {
      var a = Math.random() * Math.PI * 2, d = step * (0.6 + Math.random() * 0.6);
      x = Math.min(maxX, Math.max(pad, cx + Math.cos(a) * d));
      y = Math.min(maxY, Math.max(pad, cy + Math.sin(a) * d));
      tries++;
    } while (tries < 30 && (Math.abs(x - cx) + Math.abs(y - cy) < 30 || (x < yr.right + 12 && x + w > yr.left - 12 && y < yr.bottom + 12 && y + h > yr.top - 12)));
    no.style.left = x + 'px';
    no.style.top = y + 'px';
    dodges++;
    hint.textContent = msgs[dodges % msgs.length];
    var s = Math.min(1 + dodges * 0.06, 1.6);
    yes.style.setProperty('--grow', s);
  }

  no.addEventListener('click', dodge);
  window.addEventListener('resize', function () {
    if (!no.classList.contains('fly')) return;
    var maxX = Math.max(14, window.innerWidth - no.offsetWidth - 14);
    var maxY = Math.max(14, window.innerHeight - no.offsetHeight - 14);
    no.style.left = Math.min(maxX, Math.max(14, parseFloat(no.style.left) || 14)) + 'px';
    no.style.top = Math.min(maxY, Math.max(14, parseFloat(no.style.top) || 14)) + 'px';
  });

  yes.addEventListener('click', function (e) {
    document.body.classList.add('show-result');
    no.remove();
    var cx = e.clientX || window.innerWidth / 2, cy = e.clientY || window.innerHeight / 2;
    var items = ['💖', '💕', '💗', '🌹', '✨', '🥰', '💘', '🌸'];
    for (var i = 0; i < 42; i++) {
      var b = document.createElement('div');
      b.className = 'burst';
      b.textContent = items[i % items.length];
      b.style.left = cx + 'px';
      b.style.top = cy + 'px';
      var a = Math.random() * Math.PI * 2, d = 90 + Math.random() * 240;
      b.style.setProperty('--dx', Math.cos(a) * d + 'px');
      b.style.setProperty('--dy', Math.sin(a) * d + 'px');
      b.style.setProperty('--r', (Math.random() * 360 - 180) + 'deg');
      document.body.appendChild(b);
      setTimeout((function (el) { return function () { el.remove(); }; })(b), 1700);
    }
    for (var k = 0; k < 25; k++) setTimeout(hearts, k * 60);
  });
})();
</script>
</body>
</html>
